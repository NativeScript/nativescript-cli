tasks.configureEach({ DefaultTask currentTask ->
   // println "\t ~ [DEBUG][app] build.gradle - currentTask = ${currentTask.name} ..."

    if (currentTask =~ /compile.+JavaWithJavac/) {
        currentTask.dependsOn(runSbg)
    }

    if (currentTask =~ /mergeDex.+/) {
        currentTask.dependsOn(runSbg)
    }

    if (currentTask =~ /compile.+Kotlin.+/) {
        currentTask.dependsOn(runSbg)
    }

    if (currentTask =~ /merge.*Assets/) {
        currentTask.dependsOn(buildMetadata)
        // Hand the runtime what it cannot infer, by patching the app's
        // package.json where the assets were merged -- the app's own source file
        // is never touched, and AppConfig already reads this one at startup.
        //
        // Driven off this task's own outputs rather than
        // getMergedAssetsOutputPath(), which follows the pinned
        // project.ext.selectedBuildType and so names the release assets even in
        // a debug build.
        currentTask.doLast {
            if (!nsContentKeyedBindings) return
            currentTask.outputs.files.files.each { File out ->
                if (out.path.contains("${File.separator}incremental${File.separator}")) return
                def packageJson = new File(out, "app/package.json")
                if (!packageJson.exists()) return

                def json = new JsonSlurper().parseText(packageJson.text)
                def androidConfig = json.android ?: [:]
                // The static binding generator wrote the class names during this
                // same build; the runtime has to look them up the same way.
                androidConfig.contentKeyedBindings = true
                json.android = androidConfig
                packageJson.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))

                outLogger.withStyle(Style.SuccessHeader).println \
                        "\t + [bindings] content-keyed bindings on (generator + runtime)"
            }
        }
        // Compile the freshly-merged app JS to engine bytecode right after the
        // assets are merged (the onlyIf guard makes this a no-op unless it's a
        // release build with bytecode enabled). Packaging is made to wait for it below.
        currentTask.finalizedBy(compileBytecode)
        compileBytecode.mustRunAfter(currentTask)

    }

    // The asset pipeline is: merge*Assets -> compress*Assets -> package*. The
    // compress task reads the merged assets and zips each file into a `.js.jar`
    // that is what actually lands in the APK/App Bundle. It only depends on the
    // merge task, so without this it can run BEFORE compileBytecode and end up
    // compressing plain source — the compiled bytecode in the merged assets then
    // never reaches the package. Force compression to wait for compileBytecode so
    // the order is merge -> compileBytecode -> compress -> package. (No cycle:
    // compileBytecode only mustRunAfter the merge task, never the compress task.)
    // Debug's compress*Assets task is included so a force-enabled (-PnsBytecodeForce)
    // debug build compresses the compiled bytecode rather than plain source. The
    // task is a no-op via compileBytecode's onlyIf guard when bytecode is off.
    if (currentTask.name == "compressReleaseAssets" || currentTask.name == "compressDebugAssets") {
        currentTask.dependsOn(compileBytecode)
    }

    // Ensure the final APK/App Bundle packaging picks up the compiled bytecode.
    // Match the packaging tasks by exact name — a broad /package.*Release/ also
    // matches packageReleaseResources, which is upstream of buildMetadata ->
    // mergeReleaseAssets -> compileBytecode and creates a circular dependency.
    // Debug packaging is wired too so a force-enabled debug build ships bytecode;
    // compileBytecode's onlyIf keeps it a no-op for ordinary debug builds.
    if (currentTask.name in ["packageRelease", "packageReleaseBundle", "packageDebug", "packageDebugBundle"]) {
        currentTask.dependsOn(compileBytecode)
    }

    // R8 consumes metadata-keep-rules.pro, which buildMetadata writes. Without
    // this ordering R8 either reads the previous build's rules or fails on a
    // missing file, and either way strips classes the app reaches from JS.
    if (currentTask =~ /minify.*WithR8/) {
        currentTask.dependsOn(buildMetadata)
    }
    
    if (currentTask =~ /assemble.*Debug/ || currentTask =~ /assemble.*Release/) {
        currentTask.finalizedBy("validateAppIdMatch")
    }

    if (currentTask =~ /process.+Resources/) {
        cleanupAllJars.dependsOn(currentTask)
    }

//    if (currentTask.name == "extractProguardFiles") {
//        currentTask.finalizedBy(buildMetadata)
//    }
//
    if (currentTask =~ /generate.+LintVitalReportModel/) {
        currentTask.dependsOn(buildMetadata)
    }

    if (currentTask =~ /lintVitalAnalyze.+/) {
        currentTask.dependsOn(buildMetadata)
    }
