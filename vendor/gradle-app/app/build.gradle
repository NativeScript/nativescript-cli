task 'collectAllJars' {
    dependsOn extractAllJars
    description "gathers all paths to jar dependencies before building metadata with them"

    def sdkPath = android.sdkDirectory.getAbsolutePath()
    def androidJar = sdkPath + "/platforms/" + android.compileSdkVersion + "/android.jar"

    doFirst {
        def allJarPaths = new LinkedList<String>()
        allJarPaths.add(androidJar)
        allJarPaths.addAll(pluginsJarLibraries)
        def ft = fileTree(dir: extractedDependenciesDir, include: "**/*.jar")
        ft.each { currentJarFile ->
            allJarPaths.add(currentJarFile.getAbsolutePath())
        }

        new File("$BUILD_TOOLS_PATH/$SBG_JAVA_DEPENDENCIES").withWriter { out ->
            allJarPaths.each { out.println it }
            // The app's own classes, compiled by compileAppClassesForSbg. A
            // directory rather than a jar; the generator reads both.
            out.println layout.buildDirectory.dir("nativescript/sbg-app-classes").get().asFile.absolutePath
        }
        new File("$BUILD_TOOLS_PATH/$MDG_JAVA_DEPENDENCIES").withWriter { out ->
            allJarPaths.each {
                if (it.endsWith(".jar")) {
                    out.println it
                }
            }
        }

        new File("$BUILD_TOOLS_PATH/$SBG_INPUT_FILE").withWriter { out ->
            out.println INPUT_JS_DIR
        }
        new File("$BUILD_TOOLS_PATH/$SBG_OUTPUT_FILE").withWriter { out ->
            out.println OUTPUT_JAVA_DIR
        }

        allJarLibraries.addAll(allJarPaths)
    }
}

// Derives whitelist.mdg from the app's own JS, so metadata carries only what
// the app can reach. Opt-in: without -PnsFilterMetadata the seed is removed and
// the generator emits everything, which is the behaviour every existing build
// already has.
//
// The seed is only a starting point -- the generator closes over supertypes,
// nested classes and signature types before dropping anything, and fails the
// build if that closure turns out to be unsound. See docs/metadata-filtering.md.
def nsFilterMetadata = project.hasProperty("nsFilterMetadata")

// Build-owned, and deliberately NOT $rootDir/whitelist.mdg: that path belongs to
// the app. An app may ship its own hand-written whitelist.mdg / blacklist.mdg
// and filter without -PnsFilterMetadata at all, exactly as it could before the
// generated seed existed -- writing the seed there overwrote that file, and
// turning filtering off deleted it.
def nsGeneratedSeed = file("$projectDir/build/nativescript/generated-whitelist.mdg")

task generateMetadataSeed {
    def seedScript = "$BUILD_TOOLS_PATH/metadata-filter/seed.js"
    def generatedSeed = nsGeneratedSeed

    inputs.property("enabled", nsFilterMetadata)
    inputs.dir(APP_DIR)
    inputs.files(fileTree("$projectDir/src/main/res"))
    inputs.files(fileTree("$BUILD_TOOLS_PATH/metadata-filter") { include "*.js" })
    outputs.file(generatedSeed)

    doLast {
        if (!nsFilterMetadata) {
            // Leaving a stale seed behind would keep filtering on for a build
            // that did not ask for it -- the confusing direction to fail. Only
            // the generated file is removed; an app's own whitelist.mdg is
            // untouched and still filters.
            if (generatedSeed.exists()) {
                generatedSeed.delete()
                outLogger.withStyle(Style.Info).println "\t ~ metadata filtering off; removed the generated seed"
            }
            return
        }

        generatedSeed.parentFile.mkdirs()

        def cmd = ["node", seedScript, APP_DIR,
                   "--manifest", "$projectDir/src/main/AndroidManifest.xml",
                   "--out", generatedSeed.absolutePath]

        // Custom views, fragments and behaviours are named in resource XML and
        // instantiated by the framework; nothing in the JS mentions them.
        def resDir = file("$projectDir/src/main/res")
        if (resDir.exists()) {
            cmd.addAll(["--res", resDir.absolutePath])
        }

        def bindings = file("$BUILD_TOOLS_PATH/$SBG_BINDINGS_NAME")
        if (bindings.exists()) {
            cmd.addAll(["--sbg-bindings", bindings.absolutePath])
        }

        // This app ships files that are invalid on purpose, to test how the
        // loader reports them. Anywhere else an unparseable file disables
        // filtering for the whole build.
        cmd.addAll(["--allow-unparseable", "shared/Require/SyntaxErrorInModule",
                    "--allow-unparseable", "shared/Workers/WorkerInvalidSyntax"])

        // ProcessBuilder needs real Strings; interpolated paths are GStrings.
        def process = new ProcessBuilder(cmd.collect { it.toString() })
                .redirectErrorStream(true).start()
        process.inputStream.eachLine { outLogger.withStyle(Style.Info).println "\t ~ [metadata-seed] $it" }
        if (process.waitFor() != 0) {
            throw new GradleException("NativeScript: metadata seed generation failed.")
        }
    }
}

// Device-free guard against the one part of the seed that is written by hand.
// Wired into `check` so it runs in CI: the runtime naming a new class from
// native code is otherwise invisible until an app built with filtering on hits
// the code path that needs it.
task checkMetadataRuntimeKeepList {
    group = "verification"
    description = "Verifies RUNTIME_KEEP covers every class the runtime resolves by name."

    def runtimeSources = ["$rootDir/../../../NativeScript/ffi/jni/jsi",
                          "$rootDir/../../../NativeScript/runtime/android/jsi"]
    def script = "$BUILD_TOOLS_PATH/metadata-filter/check-runtime-keeplist.js"

    inputs.files(fileTree("$BUILD_TOOLS_PATH/metadata-filter") { include "*.js" })
    runtimeSources.each { dir ->
        if (file(dir).exists()) {
            inputs.files(fileTree(dir) { include "**/*.cpp", "**/*.h" })
        }
    }
    outputs.upToDateWhen { false }

    doLast {
        def cmd = ["node", script] + runtimeSources.findAll { file(it).exists() }
        def process = new ProcessBuilder(cmd.collect { it.toString() })
                .redirectErrorStream(true).start()
        process.inputStream.eachLine { outLogger.withStyle(Style.Info).println "\t ~ [keeplist] $it" }
        if (process.waitFor() != 0) {
            throw new GradleException(
                    "NativeScript: the metadata runtime keep-list is out of date. " +
                    "Add the classes listed above to RUNTIME_KEEP in " +
                    "build-tools/metadata-filter/seed.js.")
        }
    }
}
if (napiEngine != null) {
    tasks.matching { it.name == "check" }.configureEach { it.dependsOn(checkMetadataRuntimeKeepList) }
}

task copyMetadataFilters {

    if (napiEngine != null) {
        dependsOn generateMetadataSeed

        // Declared so the task re-runs when a filter file appears or disappears.
        // Without inputs it has none to compare, stays up to date on the strength
        // of its outputs alone, and leaves the previous build's filter in place --
        // which silently keeps filtering on for a build that turned it off.
        inputs.files("$rootDir/whitelist.mdg", "$rootDir/blacklist.mdg", nsGeneratedSeed)
        outputs.files("$BUILD_TOOLS_PATH/whitelist.mdg", "$BUILD_TOOLS_PATH/blacklist.mdg")

        // Copies at execution time, not configuration time: the seed does not exist
        // until generateMetadataSeed has run. Files.copy rather than project.copy,
        // which Gradle 9 no longer allows during execution.
        doLast {
            // The whitelist MDG reads is the app's own file, the generated seed, or
            // both concatenated. Either alone is a complete filter: an app with a
            // hand-written whitelist and no -PnsFilterMetadata filters by its list
            // (and MDG leaves it alone -- see enforceClosure in buildMetadata),
            // while a build with the flag and no app file filters by the seed.
            def whitelistParts = []
            def appWhitelist = file("$rootDir/whitelist.mdg")
            if (appWhitelist.exists()) {
                whitelistParts.add(appWhitelist.text)
            }
            if (nsFilterMetadata && nsGeneratedSeed.exists()) {
                whitelistParts.add(nsGeneratedSeed.text)
            }

            def whitelistTarget = file("$BUILD_TOOLS_PATH/whitelist.mdg")
            if (whitelistParts.isEmpty()) {
                whitelistTarget.delete()
            } else {
                whitelistTarget.text = whitelistParts.join("\n")
            }

            def blacklistSource = file("$rootDir/blacklist.mdg")
            def blacklistTarget = file("$BUILD_TOOLS_PATH/blacklist.mdg")
            if (blacklistSource.exists()) {
                Files.copy(blacklistSource.toPath(), blacklistTarget.toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
            } else {
                blacklistTarget.delete()
            }
        }
    } else {
        outputs.files("$BUILD_TOOLS_PATH/whitelist.mdg", "$BUILD_TOOLS_PATH/blacklist.mdg")
        // use an explicit copy task here because the copy task itselfs marks the whole built-tools as an output!
        copy {
            from file("$rootDir/whitelist.mdg"), file("$rootDir/blacklist.mdg")
            into "$BUILD_TOOLS_PATH"
        }
    }

}

task 'copyMetadata' {
    doLast {
        copy {
            from "$projectDir/src/main/assets/metadata"
            into getMergedAssetsOutputPath() + "/metadata"
        }
    }
}

def listf(String directoryName, ArrayList<File> store) {
    def directory = new File(directoryName)

    def resultList = new ArrayList<File>()

    def fList = directory.listFiles()
    resultList.addAll(Arrays.asList(fList))
    for (File file : fList) {
        if (file.isFile()) {
            store.add(file)
        } else if (file.isDirectory()) {
            resultList.addAll(listf(file.getAbsolutePath(), store))
        }
    }
    return resultList
}

