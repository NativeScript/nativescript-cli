            dependsOn bundleResourcesTask
        }

    }

    dependsOn copyMetadataFilters

    // As some external gradle plugins can reorder the execution order of the tasks it may happen that buildMetadata is executed after merge{Debug/Release}Assets
    // in that case the metadata won't be included in the result apk and it will crash, so to avoid this we are adding the copyMetadata task which will manually copy
    // the metadata files in the merge assets folder and they will be added to the result apk

    // The next line is added to avoid adding another copyData implementation from the firebase plugin - https://github.com/EddyVerbruggen/nativescript-plugin-firebase/blob/3943bb9147f43c41599e801d026378eba93d3f3a/publish/scripts/installer.js#L1105
    //buildMetadata.finalizedBy(copyMetadata)
    finalizedBy copyMetadata

    description "builds metadata with provided jar dependencies"

    inputs.files("$MDG_JAVA_DEPENDENCIES")

    // make MDG aware of whitelist.mdg and blacklist.mdg files
    // inputs.files(project.fileTree(dir: "$rootDir", include: "**/*.mdg"))
    // use explicit inputs as the above makes the whole build-tools directory an input!
    inputs.files("$BUILD_TOOLS_PATH/whitelist.mdg", "$BUILD_TOOLS_PATH/blacklist.mdg")

    outLogger.withStyle(Style.SuccessHeader).println "\t + buildMetadata"
    if (napiEngine != null) {

        // The generator itself decides what the metadata contains, so a change to
        // it has to invalidate the output. Without this the task stays up-to-date
        // across a generator rebuild and silently ships the previous run's tree.
        inputs.files(Paths.get(rootPath, "android-metadata-generator.jar").toString())

        // R8 keep rules derived from the same retained set as the metadata. Build
        // output, not an asset -- shipping it would put 100KB+ of build input in
        // the APK.
        outputs.file(METADATA_KEEP_RULES)
        outLogger.withStyle(Style.SuccessHeader).println "\t + output ${METADATA_KEEP_RULES}"
    }

    def classesDir = layout.buildDirectory.dir("intermediates/javac").get().asFile
    if (classesDir.exists()) {
        inputs.dir(classesDir)
    }

    def kotlinClassesDir = layout.buildDirectory.dir("tmp/kotlin-classes").get().asFile
    if (kotlinClassesDir.exists()) {
        inputs.dir(kotlinClassesDir)
    }

    outputs.files("$METADATA_OUT_PATH/treeNodeStream.dat", "$METADATA_OUT_PATH/treeStringsStream.dat", "$METADATA_OUT_PATH/treeValueStream.dat")

    workingDir "$BUILD_TOOLS_PATH"
    mainClass = "-jar"

    doFirst {
        // get compiled classes to pass to metadata generator
        // these need to be called after the classes have compiled
        new File(getMergedAssetsOutputPath() + "/metadata").deleteDir()

        def classesSubDirs = []
        def kotlinClassesSubDirs = []
        def selectedBuildType = project.ext.selectedBuildType

        rootProject.subprojects {

            def projectClassesDir = it.layout.buildDirectory.dir("intermediates/javac").get().asFile
            def projectKotlinClassesDir = it.layout.buildDirectory.dir("tmp/kotlin-classes").get().asFile

            if (projectClassesDir.exists()) {
                def projectClassesSubDirs = projectClassesDir.listFiles()
                for (File subDir : projectClassesSubDirs) {
                    if (!classesSubDirs.contains(subDir)) {
                        classesSubDirs.add(subDir)
                    }
                }
            }

            if (projectKotlinClassesDir.exists()) {
                def projectKotlinClassesSubDirs = projectKotlinClassesDir.listFiles()
                for (File subDir : projectKotlinClassesSubDirs) {
                    if (!kotlinClassesSubDirs.contains(subDir)) {
                        kotlinClassesSubDirs.add(subDir)
                    }
                }
            }
        }

        def generatedClasses = new LinkedList<String>()
        for (File subDir : classesSubDirs) {
            if (subDir.getName() == selectedBuildType) {
                generatedClasses.add(subDir.getAbsolutePath())
            }
        }

        for (File subDir : kotlinClassesSubDirs) {
            if (subDir.getName() == selectedBuildType) {
                generatedClasses.add(subDir.getAbsolutePath())
            }
        }

        def store = new ArrayList<File>()
        for (String dir : generatedClasses) {
            listf(dir, store)
        }


        new File("$BUILD_TOOLS_PATH/$METADATA_JAVA_OUT").withWriter { out ->
            store.each {
                out.println it.absolutePath
            }
        }


        new File("$BUILD_TOOLS_PATH/$MDG_OUTPUT_DIR").withWriter { out ->
            out.println "$METADATA_OUT_PATH"
        }

        new File("$BUILD_TOOLS_PATH/$MDG_JAVA_DEPENDENCIES").withWriterAppend { out ->
            generatedClasses.each { out.println it }
        }

        setOutputs outLogger

        def paramz = new ArrayList<String>()
        paramz.add(Paths.get(rootPath, "android-metadata-generator.jar"))

        if (enableAnalytics) {
            paramz.add("analyticsFilePath=$analyticsFilePath")
        }

        if (enableVerboseMDG) {
            paramz.add("verbose")
        }

        if (napiEngine != null) {

            paramz.add("proguardOut=$METADATA_KEEP_RULES")

            // Grow the whitelist into a closure, and fail the build if that closure
            // is unsound, only when the seed is the one we generated. An app's own
            // whitelist.mdg is filtered as authored -- see the comment on
            // generateMetadataSeed and Builder.applyClosureIfRequested.
            if (nsFilterMetadata) {
                paramz.add("enforceClosure=true")
            }
        }

        args paramz.toArray()
    }
}

task generateTypescriptDefinitions(type: BuildToolTask) {
    if (napiEngine != null) {
        // allJarLibraries is filled by collectAllJars at execution time; without
        // this the generator was invoked with an empty -input and failed. The task
        // has been off by default, so nothing exercised it.
        dependsOn "collectAllJars"

        def dtsGeneratorJar = "dts-generator.jar"
        if (!findProject(':dts-generator').is(null)) {
            dependsOn ':dts-generator:jar'
            dtsGeneratorJar = Paths.get(project(':dts-generator').projectDir.path,
                    "build/libs/dts-generator.jar").toString()
        }

        def paramz = new ArrayList<String>()
        def includeDirs = ["com.android.support", "/platforms/" + android.compileSdkVersion]

        workingDir "$BUILD_TOOLS_PATH"
        mainClass = "-jar"

        // Declared so Gradle can skip the task outright when no jar has changed,
        // which is what makes generating typings by default affordable: the common
        // build does no work at all, and a classpath change costs one full run.
        //
        // Keyed on the jars' *contents*, not the list of paths -- a dependency
        // upgrade keeps the same path and would otherwise go unnoticed.
        inputs.dir(extractedDependenciesDir).withPropertyName("dependencyJars")
        inputs.file(android.sdkDirectory.getAbsolutePath() + "/platforms/"
                + android.compileSdkVersion + "/android.jar").withPropertyName("androidJar")
        if (!findProject(':dts-generator').is(null)) {
            // By path, not by task: the other project is not configured yet, so
            // tasks.named("jar") would fail during evaluation.
            inputs.files(fileTree("${project(':dts-generator').projectDir}/build/libs") {
                include "*.jar"
            }).withPropertyName("generator")
        }
        outputs.dir(TYPINGS_PATH).withPropertyName("typings")

        doFirst {
            delete "$TYPINGS_PATH"

            paramz.add(dtsGeneratorJar)
            paramz.add("-input")

            for (String jarPath : allJarLibraries) {
                // don't generate typings for runtime jars and classes
                if (shouldIncludeDirForTypings(jarPath, includeDirs)) {
                    paramz.add(jarPath)
                }
            }

            paramz.add("-output")
            paramz.add("$TYPINGS_PATH")

            new File("$TYPINGS_PATH").mkdirs()

            logger.info("Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', ''))
            outLogger.withStyle(Style.SuccessHeader).println "Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', '')

            setOutputs outLogger

            args paramz.toArray()
        }
    } else {
        if (!findProject(':dts-generator').is(null)) {
            dependsOn ':dts-generator:jar'
        }

        def paramz = new ArrayList<String>()
        def includeDirs = ["com.android.support", "/platforms/" + android.compileSdkVersion]

        workingDir "$BUILD_TOOLS_PATH"
        mainClass = "-jar"

        doFirst {
            delete "$TYPINGS_PATH"

            paramz.add("dts-generator.jar")
            paramz.add("-input")

            for (String jarPath : allJarLibraries) {
                // don't generate typings for runtime jars and classes
                if (shouldIncludeDirForTypings(jarPath, includeDirs)) {
                    paramz.add(jarPath)
                }
            }

            paramz.add("-output")
            paramz.add("$TYPINGS_PATH")

            new File("$TYPINGS_PATH").mkdirs()

            logger.info("Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', ''))
            outLogger.withStyle(Style.SuccessHeader).println "Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', '')

            setOutputs outLogger

            args paramz.toArray()
        }
    }
    
}

// Off by default: the dts-generator walks the whole compile classpath, which is
// slow, and most builds never look at the output. TypeScript users who need the
// typings to call anything native opt in per build with -PgenerateTypings
// (bare, or =true); -PgenerateTypings=false is still an explicit no.
generateTypescriptDefinitions.onlyIf {
    project.hasProperty("generateTypings") &&
            (project.generateTypings.toString().isEmpty()
                    || Boolean.parseBoolean(project.generateTypings.toString()))
}

collectAllJars.finalizedBy(generateTypescriptDefinitions)

static def shouldIncludeDirForTypings(path, includeDirs) {
    for (String p : includeDirs) {
        if (path.indexOf(p) > -1) {
            return true
        }
    }

    return false
}

task 'copyTypings' {
    doLast {
        outLogger.withStyle(Style.Info).println "Copied generated typings to application root level. Make sure to import android.d.ts in reference.d.ts"

        copy {
            from "$TYPINGS_PATH"
            into "$USER_PROJECT_ROOT"
        }
    }
}

copyTypings.onlyIf { generateTypescriptDefinitions.didWork }
generateTypescriptDefinitions.finalizedBy(copyTypings)

task 'validateAppIdMatch' {
    doLast {
        def lineSeparator = System.getProperty("line.separator")

        if (project.hasProperty("nsApplicationIdentifier") && !project.hasProperty("release")) {
            if (project.nsApplicationIdentifier != android.defaultConfig.applicationId && android.namespace != appIdentifier) {
                def errorMessage = "${lineSeparator}WARNING: The Application identifier is different from the one inside \"package.json\" file.$lineSeparator" +
                        "NativeScript CLI might not work properly.$lineSeparator" +
                        "Remove applicationId from app.gradle and update the \"nativescript.id\" in package.json.$lineSeparator" +
                        "Actual: ${android.defaultConfig.applicationId}$lineSeparator" +
                        "Expected(from \"package.json\"): ${project.nsApplicationIdentifier}$lineSeparator"

                logger.error(errorMessage)
            }
        }
    }
}


////////////////////////////////////////////////////////////////////////////////////
////////////////////////// COMPILE-TIME BYTECODE ///////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////
//
// For RELEASE builds, replace the plain-JS app bundle in the merged assets with
// pre-compiled bytecode for the active JS engine (Hermes today; QuickJS/QuickJS-NG/
// PrimJS are wired but gated off until their compilers + runtime support land).
// The files keep their .js names, so module resolution is unaffected; the runtime
// detects the engine's bytecode magic at load time (see js_run_bytecode_file /
// ModuleInternal) and runs it directly instead of parsing + compiling source,
// which greatly improves TTI.
//
// The engine-generic driver decides whether the selected engine has a usable
// compiler for the build host, so this task simply runs it for every release
// build and lets it no-op when there's nothing to do. It only touches the
// merged-assets build intermediate, never the app source.
//
// Requires the runtime's gradle.properties to declare `ns_engine`; without it
// the task is a no-op (older runtimes ship no bytecode compiler).
//
// Disable for a release build with:  -PnsBytecodeDisabled
// Force-enable for a debug build with: -PnsBytecodeForce
// Enable source maps with:           -PnsBytecodeSourceMaps
//
// Overridable paths:
//   -PbytecodeToolsDir=<dir>          — the bytecode-compiler tools folder
//   -PbytecodeCompilerBinary=<path>   — force a specific compiler binary
//   -PnodePath=<path>                 — the node executable

def bytecodeDisabled = project.hasProperty("nsBytecodeDisabled") || project.hasProperty("bytecodeDisabled")
// Force bytecode compilation even for debug builds. Bytecode is a release-only
// feature by default; this opt-in flag makes debug builds compile to bytecode
// too, which is handy for testing/debugging the bytecode path itself.
def bytecodeForced = project.hasProperty("nsBytecodeForce") || project.hasProperty("bytecodeForce")
// A release build is not reliably signalled by -Prelease (the CLI runs
// assembleRelease/bundleRelease without it), so detect it from the requested
// task names — the same heuristic the rest of this file uses.
def isReleaseBuild = project.hasProperty("release") ||
        project.gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

project.ext.bytecodeEnabled = napiEngine != null && (isReleaseBuild || bytecodeForced) && !bytecodeDisabled

// Announce the bytecode status once at configuration time so it's obvious in the
// build log whether ahead-of-time bytecode will be produced.
if (project.ext.bytecodeEnabled) {
    def buildKind = isReleaseBuild ? "release build" : "debug build (forced via -PnsBytecodeForce)"
    outLogger.withStyle(Style.SuccessHeader).println "\t + [bytecode] ENABLED for ${buildKind} (engine: ${napiEngine})"
    outLogger.withStyle(Style.Info).println "\t   ~ app JS will be compiled to bytecode after asset merge (if ${napiEngine} has a compiler for this host)."
    outLogger.withStyle(Style.Info).println "\t   ~ disable with -PnsBytecodeDisabled"
} else if (napiEngine != null) {
    def bytecodeReason = bytecodeDisabled ? "disabled via -PnsBytecodeDisabled"
            : "debug build (release-only feature; force with -PnsBytecodeForce)"
    outLogger.withStyle(Style.Info).println "\t ~ [bytecode] DISABLED — ${bytecodeReason}; shipping plain JS. isReleaseBuid: ${isReleaseBuild};"
}

// The compiler tooling ships in the framework template under build-tools; fall
// back to the in-repo location when building the runtime itself (test-app).
def resolveBytecodeToolsDir = { ->
    if (project.hasProperty("bytecodeToolsDir")) return bytecodeToolsDir as String
    def candidates = [
            "$rootDir/build-tools/bytecode-compiler" as String,
            "$rootDir/../tools/bytecode-compiler" as String,
    ]
    return candidates.find { new File(it).exists() } ?: candidates[0]
}
def resolveNodePath = { ->
    project.hasProperty("nodePath") ? nodePath as String : "node"
}

task compileBytecode {
    // No inputs/outputs declared on purpose: the task is cheap and idempotent
    // (it skips files that are already bytecode) and must re-run whenever the
    // merged assets are refreshed.
    onlyIf { project.ext.bytecodeEnabled }
    doLast {
        def appDir = getMergedAssetsOutputPath() + "/app"
        if (!new File(appDir).exists()) {
            outLogger.withStyle(Style.Info).println "\t ~ [bytecode] no merged app assets at ${appDir}, skipping"
            return
        }
        def toolsDir = resolveBytecodeToolsDir()
        def script = "$toolsDir/compile-bytecode.js"
        def node = resolveNodePath()
        def sourceMaps = project.hasProperty("nsBytecodeSourceMaps")
        // Resilient by default: a file that fails to compile is left as plain JS
        // (the runtime loads source directly) and the build continues. Opt into
        // fail-the-build behaviour with -PnsBytecodeStrict.
        def strict = project.hasProperty("nsBytecodeStrict")

        outLogger.withStyle(Style.SuccessHeader).println "\t + [bytecode] compiling app JS → ${napiEngine} bytecode"
        outLogger.withStyle(Style.Info).println "\t   ~ engine:      ${napiEngine}"
        outLogger.withStyle(Style.Info).println "\t   ~ app assets:  ${appDir}"
        outLogger.withStyle(Style.Info).println "\t   ~ driver:      ${script}"
        if (project.hasProperty("bytecodeCompilerBinary")) {
            outLogger.withStyle(Style.Info).println "\t   ~ compiler:    ${bytecodeCompilerBinary}"
        }
        outLogger.withStyle(Style.Info).println "\t   ~ source maps: ${sourceMaps ? "on" : "off"}"
        outLogger.withStyle(Style.Info).println "\t   ~ on error:    ${strict ? "fail the build (strict)" : "skip file, keep source"}"

        def cmd = [node, script, "--app", appDir, "--engine", napiEngine]
        if (project.hasProperty("bytecodeCompilerBinary")) {
            cmd += ["--compiler", bytecodeCompilerBinary as String]
        }
        if (sourceMaps) {
            cmd += ["--source-maps"]
        }
        if (!strict) {
            cmd += ["--keep-going"]
        }
        // The driver prints its own "[bytecode] ... compiled N file(s)" summary to
        // stdout, which surfaces in the build log below.
        exec {
            commandLine cmd
        }
        outLogger.withStyle(Style.SuccessHeader).println "\t + [bytecode] done."
    }
}


